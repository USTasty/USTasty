<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>All Exoplanets</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; }
    table { border-collapse: collapse; width: 100%; margin-top: 20px; }
    th, td { border: 1px solid #888; padding: 6px 10px; text-align: left; }
    th { background-color: #eee; }
    #loading { color: blue; font-weight: bold; }
  </style>
</head>
<body>

  <h1>All Exoplanets</h1>
  <p id="loading">Loading data...</p>

  <table id="planetTable">
    <thead>
      <tr>
        <th>Planet Name</th>
        <th>Host Star</th>
        <th>Distance (pc)</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <script>
    // Load local planets.json generated by Python
    fetch("planets.json")
      .then(res => res.json())
      .then(data => {
        const tbody = document.querySelector("#planetTable tbody");
        data.forEach(item => {
          const row = document.createElement("tr");

          const nameCell = document.createElement("td");
          nameCell.textContent = item.pl_name;
          row.appendChild(nameCell);

          const hostCell = document.createElement("td");
          hostCell.textContent = item.hostname;
          row.appendChild(hostCell);

          const distCell = document.createElement("td");
          distCell.textContent = item.sy_dist;
          row.appendChild(distCell);

          tbody.appendChild(row);
        });

        document.getElementById("loading").textContent = `Loaded ${data.length} planets.`;
      })
      .catch(err => {
        console.error(err);
        document.getElementById("loading").textContent = "Error loading data: " + err.message;
      });
  </script>

</body>
</html>
